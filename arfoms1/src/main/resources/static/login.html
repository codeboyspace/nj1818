<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ARFORMS - Login</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<style>
			.top-header {
				background: linear-gradient(135deg, #0f172a 0%, #0b1f5e 100%);
				padding: 16px 32px;
				text-align: center;
				box-shadow: 0 4px 20px rgba(2, 6, 23, 0.4);
			}

			.top-header h1 {
				font-size: 1.5rem;
				font-weight: 700;
				color: #fff;
				letter-spacing: 1.5px;
				margin: 0;
			}

			.top-header p {
				font-size: 0.8rem;
				color: rgba(255, 255, 255, 0.6);
				margin: 0;
			}
		</style>
	</head>
	<body class="bg-light">
		<!-- Top Header -->
		<header class="top-header">
			<h1>ARFORMS</h1>
			<p>Airline Reservation &amp; Flight Operations Management System</p>
		</header>

		<div class="container" style="max-width: 420px">
			<div class="card shadow-sm mt-5">
				<div class="card-body p-4">
					<h2 class="h5 text-center mb-4">Sign In</h2>

					<form id="loginForm">
						<div class="mb-3">
							<label class="form-label" for="role">Role</label>
							<select class="form-select" id="role">
								<option>Flight Scheduler</option>
								<option>Reservation Agent</option>
								<option>Crew Scheduler</option>
								<option>Loyalty Manager</option>
							</select>
						</div>
						<div class="mb-3">
							<label class="form-label" for="username">Username</label>
							<input
								class="form-control"
								type="text"
								id="username"
								placeholder="Enter your username"
								required
							/>
						</div>
						<div class="mb-4">
							<label class="form-label" for="password">Password</label>
							<input
								class="form-control"
								type="password"
								id="password"
								placeholder="Enter your password"
								required
							/>
						</div>
						<button class="btn btn-primary w-100" type="submit">Sign In</button>
					</form>
				</div>
			</div>
		</div>

		<script>
			document.getElementById('loginForm').addEventListener('submit', (e) => {
				e.preventDefault();

				// Credentials are not validated - any username/password is accepted.
				// Routing is based purely on the selected role.
				const role = document.getElementById('role').value;

				const destinations = {
					'Flight Scheduler': 'flights.html',
					'Reservation Agent': 'search-flights.html',
					'Crew Scheduler': 'crew_roster_management.html',
					'Loyalty Manager': 'loyalty_admin_portal.html',
				};

				// Default to the flight search page for any other role.
				window.location.href = destinations[role] || 'search-flights.html';
			});
		</script>
	</body>
</html>
