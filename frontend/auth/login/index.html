<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARFOMS - Login</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card { 
            width: 100%;
            max-width: 450px; 
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .login-header {
            background: linear-gradient(135deg, #0b1f5e, #1d4ed8);
            color: white;
            padding: 2rem;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
        .login-header i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="login-header">
            <i class="fa-solid fa-plane-up"></i>
            <h3 class="mb-0 fw-bold">ARFOMS Login</h3>
        </div>
        <div class="card-body p-4">
            <div id="errorBox" class="alert alert-danger d-none"></div>
            <div id="loginStatusBox" class="alert alert-success d-none">Login successful! Redirecting...</div>
            
            <form id="loginForm">
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-bold" style="background-color: #1d4ed8; border:none;">
                    Sign In <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>
                <div class="text-center mt-4">
                    <span class="text-muted">Don't have an account?</span> 
                    <a href="/auth/register/index.html" class="text-decoration-none fw-bold" style="color: #1d4ed8;">Register here</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginBtn = document.getElementById('loginBtn');
            const errorBox = document.getElementById('errorBox');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
            errorBox.classList.add('d-none');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const payload = { username: username, password: password };
                const res = await fetch('http://localhost:8210/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (res.ok && data.token) {
                    localStorage.setItem('arfoms_token', data.token);
                    localStorage.setItem('arfoms_role', data.role || 'user');
                    localStorage.setItem('arfoms_name', data.name || username);
                    
                    document.getElementById('loginStatusBox').classList.remove('d-none');
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1000);
                } else {
                    throw new Error(data.message || 'Invalid credentials');
                }
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('d-none');
            } finally {
                loginBtn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right ms-2"></i>';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
