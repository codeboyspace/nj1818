server.port=8210

# Single-machine dev setup: call the module services directly on their fixed
# localhost ports. This bypasses Spring Cloud LoadBalancer/Eureka resolution,
# which was intermittently failing at runtime and returning HTTP 500 from the
# gateway even though each service was registered and reachable directly.
gateway.flight-service.base-url=http://localhost:8181
gateway.booking-service.base-url=http://localhost:8182
gateway.checkin-service.base-url=http://localhost:8193
gateway.crew-service.base-url=http://localhost:8184
gateway.loyalty-service.base-url=http://localhost:8185

# --- Eureka service discovery ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# --- Spring Security (API gateway) ---
# Role-based HTTP Basic auth on the module APIs. Set to false to disable enforcement.
arfoms.security.enabled=true

# Admin (full access to every module)
arfoms.security.admin.name=admin
arfoms.security.admin.password=Admin@123

gateway.auth-service.base-url=http://localhost:8180

# Flight Scheduler -> /api/flights, /api/v1/flights
arfoms.security.scheduler.name=scheduler
arfoms.security.scheduler.password=Scheduler@123

# Reservation Agent -> /api/bookings, /flights, /airline/api/seats
arfoms.security.agent.name=agent
arfoms.security.agent.password=Agent@123

# Crew -> /api/crew
arfoms.security.crew.name=crew
arfoms.security.crew.password=Crew@123

# Loyalty Manager -> /api/loyalty
arfoms.security.loyalty.name=loyalty
arfoms.security.loyalty.password=Loyalty@123

# Ground Staff -> /api/checkin
arfoms.security.groundstaff.name=groundstaff
arfoms.security.groundstaff.password=Ground@123
